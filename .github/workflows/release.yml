name: Auto Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Generate Unique Tag
        id: tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG="v${VERSION}-${TIMESTAMP}-${SHORT_SHA}"
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT
          echo "Generated Tag: ${TAG}"

      # ⭐ NEW: Stamp the tag into package.json before zipping
      - name: Stamp package.json with tag
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ steps.tag.outputs.TAG }}'.replace(/^v/, '');
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          echo "Stamped version:"
          node -p "require('./package.json').version"

      - name: Create release zip
        run: |
          zip -r release.zip bot.js package.json settings.js server.js index.js

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: ${{ steps.tag.outputs.TAG }}
          files: release.zip
          generate_release_notes: true
          draft: false
          prerelease: false
