          LAST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")
          LAST_INDEX=-1
          if [ -n "$LAST_TAG" ]; then
            for i in "${!CODENAMES[@]}"; do
              if [[ "$LAST_TAG" == *"-${CODENAMES[$i]}"* ]]; then
                LAST_INDEX=$i
                break
              fi
            done
          fi

          NEXT_INDEX=$(( (LAST_INDEX + 1) % ${#CODENAMES[@]} ))
          CODENAME=${CODENAMES[$NEXT_INDEX]}

          TAG="v${VERSION}-${CODENAME}"

          if gh release view "$TAG" > /dev/null 2>&1; then
            SHORT_SHA=$(git rev-parse --short HEAD)
            TAG="v${VERSION}-${CODENAME}-${SHORT_SHA}"
          fi

          echo "TAG=${TAG}" >> $GITHUB_OUTPUT
          echo "Generated Tag: ${TAG}"

      - name: Create release zip
        run: |
          zip -r release.zip bot.js package.json settings.js server.js index.js

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: ${{ steps.tag.outputs.TAG }}
          files: release.zip
          generate_release_notes: true
          draft: false
          prerelease: false
